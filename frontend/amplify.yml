# Build spec para Amplify Hosting, para cuando conectas el repo desde la
# consola con "App root" = frontend/ (modo monorepo). Amplify detecta este
# archivo solo dentro de esa carpeta, asi que las rutas de abajo son
# relativas a frontend/, no a la raiz del repo.
#
# Si en cambio despliegas con amplify.template.yaml (raiz del repo), ese
# stack define su propio buildSpec inline porque no usa el modo monorepo.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
