AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Cloud Flashcards - aplicacion serverless que convierte apuntes en Markdown
  en mazos de flashcards consultables via REST API. Incluye un pipeline de
  importacion que normaliza cuestionarios exportados desde Notion.

Parameters:
  ProjectName:
    Type: String
    Default: cloud-flashcards
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
    Description: Prefijo usado para nombrar los recursos del stack.

  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Entorno logico (dev, staging, prod). Afecta nombres de todos los recursos.

  ApiStageName:
    Type: String
    Default: v1
    AllowedPattern: "^[a-zA-Z0-9_-]{1,64}$"
    Description: >
      Stage del REST API. A diferencia del HTTP API, el REST API no admite
      "$default": el nombre del stage siempre forma parte de la URL.

  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: >
      Origen permitido por CORS. En produccion se recomienda fijar el dominio
      exacto del frontend (p.ej. https://flashcards.midominio.dev) en lugar de "*".

# Configuracion compartida por todas las funciones Lambda
Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref FlashcardsTable
        LOG_LEVEL: INFO
    Tags:
      Project: !Ref ProjectName
      Stage: !Ref Stage

Resources:
  # NOTA: el nombre del bucket se construye con !Sub, NO con !Ref.
  # Motivo: SAM inyecta NotificationConfiguration, lo que crea una dependencia
  # circular si la politica IAM usa !Ref DecksBucket.
  DecksBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-decks-${Stage}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ImportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-imports-${Stage}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FlashcardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-questions-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deckId
          AttributeType: S
        - AttributeName: questionId
          AttributeType: S
        - AttributeName: entity
          AttributeType: S
        - AttributeName: catalogSort
          AttributeType: S
      KeySchema:
        - AttributeName: deckId
          KeyType: HASH
        - AttributeName: questionId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DecksIndex
          KeySchema:
            - AttributeName: entity
              KeyType: HASH
            - AttributeName: catalogSort
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - deckTitle
              - category
              - questionCount
              - updatedAt
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Stage
          Value: !Ref Stage

  # Lambda 1: ingesta. S3 (*.md creado/borrado) -> DynamoDB
  ParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-parser-${Stage}"
      CodeUri: backend/parser/
      Handler: app.lambda_handler
      Description: Parsea un mazo en Markdown desde S3 y lo materializa en DynamoDB.
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-decks-${Stage}-${AWS::AccountId}-${AWS::Region}/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:BatchWriteItem
              Resource: !GetAtt FlashcardsTable.Arn
      Events:
        MarkdownUploaded:
          Type: S3
          Properties:
            Bucket: !Ref DecksBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .md
        MarkdownDeleted:
          Type: S3
          Properties:
            Bucket: !Ref DecksBucket
            Events: s3:ObjectRemoved:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .md

  # Lambda 2: normalizacion. imports (*.md ajeno) -> decks (*.md canonico)
  NormalizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-normalizer-${Stage}"
      CodeUri: backend/normalizer/
      Handler: app.lambda_handler
      Description: Convierte cuestionarios de Notion al formato canonico.
      Environment:
        Variables:
          # Nombre literal, no !Ref: ver la nota de dependencia circular en DecksBucket.
          DECKS_BUCKET: !Sub "${ProjectName}-decks-${Stage}-${AWS::AccountId}-${AWS::Region}"
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-imports-${Stage}-${AWS::AccountId}-${AWS::Region}/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-decks-${Stage}-${AWS::AccountId}-${AWS::Region}/*"
      Events:
        ImportUploaded:
          Type: S3
          Properties:
            Bucket: !Ref ImportsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .md

  # Lambda 3: consulta. GET /decks y GET /decks/{deckId}
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api-${Stage}"
      CodeUri: backend/api/
      Handler: app.lambda_handler
      Description: Sirve el catalogo de mazos y las preguntas de cada uno.
      Environment:
        Variables:
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt FlashcardsTable.Arn
                - !Sub "${FlashcardsTable.Arn}/index/DecksIndex"
      Events:
        ListDecks:
          Type: Api
          Properties:
            RestApiId: !Ref FlashcardsApi
            Path: /decks
            Method: GET
        GetDeck:
          Type: Api
          Properties:
            RestApiId: !Ref FlashcardsApi
            Path: /decks/{deckId}
            Method: GET


  # REST API (v1). CORS: OPTIONS mock en gateway + cabecera en Lambda + GatewayResponses.
  FlashcardsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectName}-api-${Stage}"
      StageName: !Ref ApiStageName
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${CorsAllowOrigin}'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,OPTIONS'"
        MaxAge: "'600'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100

  # Retencion de logs (sin esto, los log groups son "Never expire")
  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-parser-${Stage}"
      RetentionInDays: 14

  NormalizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-normalizer-${Stage}"
      RetentionInDays: 14

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-api-${Stage}"
      RetentionInDays: 14

# Salidas
Outputs:
  Stage:
    Description: Entorno desplegado.
    Value: !Ref Stage

  ApiBaseUrl:
    Description: URL base del REST API, con el stage incluido.
    Value: !Sub "https://${FlashcardsApi}.execute-api.${AWS::URLSuffix}/${ApiStageName}"

  DecksBucketName:
    Description: Bucket de mazos en formato canonico.
    Value: !Ref DecksBucket

  ImportsBucketName:
    Description: Bucket donde subir exports de Notion para convertirlos.
    Value: !Ref ImportsBucket

  FlashcardsTableName:
    Description: Tabla DynamoDB con las preguntas.
    Value: !Ref FlashcardsTable
